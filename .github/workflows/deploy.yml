name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            accountingnight/package-lock.json
            slideshow-player/package-lock.json
            table/package-lock.json
            savepoint/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: accountingnight

      - name: Lint
        run: npm run lint
        working-directory: accountingnight

      - name: Test
        run: npm run test
        working-directory: accountingnight

      - name: Build
        run: npm run build
        working-directory: accountingnight
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Install slideshow dependencies
        run: npm ci
        working-directory: slideshow-player

      - name: Lint slideshow
        run: npm run lint
        working-directory: slideshow-player

      - name: Test slideshow
        run: npm run test
        working-directory: slideshow-player

      - name: Build slideshow
        run: npm run build
        working-directory: slideshow-player

      - name: Install table planner dependencies
        run: npm ci
        working-directory: table

      - name: Lint table planner
        run: npm run lint
        working-directory: table

      - name: Test table planner
        run: npm run test
        working-directory: table

      - name: Build table planner
        run: npm run build
        working-directory: table

      - name: Install Savepoint dependencies
        run: npm ci
        working-directory: savepoint

      - name: Test Savepoint
        run: npm test
        working-directory: savepoint

      - name: Build Savepoint
        run: npm run build
        working-directory: savepoint

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='accountingnight/' \
            --exclude='slideshow-player/' \
            --exclude='table/' \
            --exclude='savepoint/' \
            ./ _site/
          mkdir -p _site/accountingnight
          cp -R accountingnight/dist/. _site/accountingnight/
          mkdir -p _site/slideshow-player
          cp -R slideshow-player/dist/. _site/slideshow-player/
          mkdir -p _site/table
          cp -R table/dist/. _site/table/
          mkdir -p _site/savepoint
          cp -R savepoint/dist/. _site/savepoint/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
