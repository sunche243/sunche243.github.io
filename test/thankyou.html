<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>주문 완료</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="customer-page thankyou-page page-thankyou">

  <div class="customer-shell thankyou-shell">
    <header class="customer-hero customer-hero--success">
      <div class="customer-step-badge">STEP 3 / 3</div>
      <h2>주문이 완료되었어요! 🎉</h2>
      <p class="customer-hero-copy">
        이제 아래 계좌로 입금해 주시면 주문 준비가 바로 시작됩니다.
      </p>
      <div class="flow-progress">
        <span class="flow-progress-item is-done">메뉴 선택</span>
        <span class="flow-progress-item is-done">주문 확인</span>
        <span class="flow-progress-item is-current">주문 완료</span>
      </div>
    </header>

    <div class="box thankyou-order-card">
      <div class="check-summary-block">
        <div class="check-summary-label">테이블 번호</div>
        <div class="check-summary-value" id="tableNum">-</div>
      </div>

      <div class="check-summary-block">
        <div class="check-summary-label">입금자명</div>
        <div class="check-summary-value" id="payer">-</div>
      </div>

      <div class="check-summary-block">
        <div class="check-summary-label">주문한 항목</div>
        <div id="items" class="check-item-list">-</div>
      </div>

      <div class="check-summary-total">
        <span>총 금액</span>
        <strong id="totalPrice">0원</strong>
      </div>
    </div>

    <div class="box thankyou-payment-card">
      <div class="thankyou-account-box">
        <div class="thankyou-account-label">입금 계좌</div>
        <div class="payment-card-title">입금 후 주문 준비가 시작돼요</div>
        <div class="thankyou-account-number" id="accountNumber">-</div>

        <div class="payment-action-group">
          <button class="copy-btn" id="copyBtn" type="button">계좌번호 복사</button>
          <button class="toss-btn" id="tossBtn" type="button">토스로 송금하기</button>
        </div>

        <p id="copyMsg" class="copy-feedback" style="display:none;">계좌번호가 복사되었습니다!</p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/thankyou.js"></script>

</body>
</html>
