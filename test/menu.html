<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 주문</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<h2>메뉴 주문</h2>
<i id="tableInfo" style="font-size: 0.9rem; color: gray;"></i>

<form id="orderForm">

  <div class="section">
    <label><strong>입금자명(테이블번호)</strong></label>
    <input
      type="text"
      id="payerName"
      required
      placeholder="예: 홍길동(3) 또는 홍길동 3"
    />
    <button type="button" id="menuViewBtn" class="menu-btn">
      📋 메뉴판 보기
    </button>
  </div>

  <div class="section">
    <h3>🍽 메인 메뉴</h3>
    <div id="mainMenuSection"></div>
  </div>

  <div class="section">
    <h3>🥗 사이드 메뉴</h3>
    <div id="sideMenuSection"></div>
  </div>

  <button class="submit-btn" type="submit">주문 확인</button>

</form>

<div id="noticeModal" class="modal">
  <div class="modal-content">
    <p>
      첫 주문시에는 최소 메인메뉴 1개 + 사이드메뉴 1개를 주문해주셔야 해요.<br>
      사이드메뉴 2개는 메인메뉴 1개로 간주해요.<br><br>
      입금자명 혹은 테이블 번호를 잘못 기입하거나, 메뉴를 잘못 선택하여 주문한 경우<br>
      <strong>취소 및 환불이 어려우니</strong> 이를 염두에 두시고 주문해 주시길 바래요.
    </p>
    <button id="closeModal">확인</button>
  </div>
</div>

<div id="menuModal" class="modal" style="display: none;">
  <div class="modal-content">
    <img src="menu.png" alt="메뉴판" />
    <button id="closeMenuModal">닫기</button>
  </div>
</div>

<script type="module" src="./js/menu.js"></script>

</body>
</html>
