<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 주문</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<h2>메뉴 주문</h2>
<i id="tableInfo" style="font-size: 0.9rem; color: gray;"></i>

<form id="orderForm">

  <div class="section">
    <label><strong>입금자명(테이블번호)</strong></label>
    <input
      type="text"
      id="payerName"
      required
      placeholder="예: 홍길동(3) 또는 홍길동 3"
    />
    <button type="button" id="menuViewBtn" class="menu-btn">
      📋 메뉴판 보기
    </button>
  </div>

  <div class="section">
    <h3>🍽 메인 메뉴</h3>
    <div id="mainMenuSection"></div>
  </div>

  <div class="section">
    <h3>🥗 사이드 메뉴</h3>
    <div id="sideMenuSection"></div>
  </div>

  <div class="menu-total-box">
    <span class="menu-total-label">현재 총 예상 금액</span>
    <strong class="menu-total-value" id="estimatedTotalPrice">0원</strong>
  </div>

  <div class="menu-summary-box">
    <div class="menu-summary-header">
      <div class="menu-summary-title">선택한 메뉴</div>
      <button type="button" id="resetMenuBtn" class="reset-menu-btn">선택 초기화</button>
    </div>
    <div id="selectedMenuSummary" class="menu-summary-empty">아직 선택한 메뉴가 없어요.</div>
  </div>

  <button class="submit-btn" type="submit">주문 확인</button>

</form>

<div id="noticeModal" class="modal">
  <div class="modal-content">
    <p id="noticeMessage"></p>
    <button id="closeModal">확인</button>
  </div>
</div>

<div id="menuModal" class="modal" style="display: none;">
  <div class="modal-content">
    <img id="menuImage" src="menu.png" alt="메뉴판" />
    <button id="closeMenuModal">닫기</button>
  </div>
</div>

<script type="module" src="./js/menu.js"></script>

</body>
</html>
