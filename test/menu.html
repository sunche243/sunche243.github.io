<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 주문</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="customer-page page-menu">

<div class="customer-shell menu-shell">
  <header class="customer-hero customer-hero--menu">
    <div class="customer-step-badge">STEP 1 / 3</div>
    <h2>메뉴 주문</h2>
    <p class="customer-hero-copy">
      현장에서 바로 주문하고 빠르게 확인할 수 있도록 준비했어요.
      원하는 메뉴와 옵션을 고른 뒤 주문을 진행해 주세요.
    </p>
    <div class="customer-hero-meta">
      <i id="tableInfo" class="table-pill"></i>
      <button type="button" id="menuViewBtn" class="menu-btn hero-menu-btn">
        📋 메뉴판 보기
      </button>
      <button type="button" id="staffCallBtn" class="menu-btn staff-call-btn">
        직원 호출
      </button>
      <button type="button" id="myOrdersBtn" class="menu-btn my-orders-btn">
        내 주문 보기
      </button>
    </div>
  </header>

  <div id="emergencyNoticeBanner" class="emergency-notice-banner" style="display: none;">
    <strong>긴급 공지</strong>
    <span id="emergencyNoticeText"></span>
  </div>

  <form id="orderForm" class="customer-form customer-form--menu">
    <div class="section section-card payer-card">
      <div class="section-heading">
        <div>
          <div class="section-eyebrow">입금자 정보</div>
          <label for="payerName"><strong>입금자명(테이블번호)</strong></label>
        </div>
        <p class="section-note">예: 홍길동(3) 또는 홍길동 3</p>
      </div>
      <input
        type="text"
        id="payerName"
        required
        placeholder="입금자명과 테이블 번호를 함께 입력해 주세요"
      />
    </div>

    <div class="section section-card menu-category-panel">
      <div class="section-heading">
        <div class="section-eyebrow">MAIN</div>
        <h3>🍽 메인 메뉴</h3>
      </div>
      <div id="mainMenuSection"></div>
    </div>

    <div class="section section-card menu-category-panel">
      <div class="section-heading">
        <div class="section-eyebrow">SIDE</div>
        <h3>🥗 사이드 메뉴</h3>
      </div>
      <div id="sideMenuSection"></div>
    </div>

    <div class="section section-card menu-category-panel">
      <div class="section-heading">
        <div class="section-eyebrow">DRINK</div>
        <h3>🥤 음료 메뉴</h3>
      </div>
      <div id="drinkMenuSection"></div>
    </div>

    <div class="menu-summary-box menu-summary-box--selected">
      <div class="menu-summary-header">
        <div>
          <div class="menu-summary-title">선택한 메뉴</div>
          <div class="menu-summary-caption">주문 전 마지막으로 구성을 확인해 주세요.</div>
        </div>
        <button type="button" id="resetMenuBtn" class="reset-menu-btn">선택 초기화</button>
      </div>
      <div id="selectedMenuSummary" class="menu-summary-empty">아직 선택한 메뉴가 없어요.</div>
    </div>

    <div class="menu-sticky-bar">
      <div class="menu-sticky-bar-inner">
        <div class="menu-total-box menu-total-box--sticky">
          <span class="menu-total-label">현재 총 예상 금액</span>
          <strong class="menu-total-value" id="estimatedTotalPrice">0원</strong>
        </div>
        <button class="submit-btn" type="submit">주문 확인</button>
      </div>
    </div>
  </form>
</div>

<div id="noticeModal" class="modal">
  <div class="modal-content">
    <p id="noticeMessage"></p>
    <button id="closeModal">확인</button>
  </div>
</div>

<div id="menuModal" class="modal" style="display: none;">
  <div class="modal-content">
    <img id="menuImage" src="menu.png" alt="메뉴판" />
    <button id="closeMenuModal">닫기</button>
  </div>
</div>

<div id="myOrdersModal" class="modal" style="display: none;">
  <div class="modal-content my-orders-modal-content">
    <div class="my-orders-modal-header">
      <strong>내 주문 보기</strong>
      <button id="closeMyOrdersModal" type="button">닫기</button>
    </div>
    <div id="myOrdersContent" class="my-orders-content"></div>
  </div>
</div>

<script type="module" src="./js/menu.js"></script>

</body>
</html>
