<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 페이지</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <h2>주문 관리</h2>

  <div class="admin-toolbar">

    </select>
  </div>

  <div id="orders" class="grid"></div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
